name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest commands or code that reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nova version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Rust version
    validations:
      required: true

