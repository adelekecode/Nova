[workspace]
members = [
    "crates/cli",
    "crates/compression",
    "crates/engine",
    "crates/protocol",
    "crates/replication",
    "crates/server",
    "crates/storage",
    "crates/types",
    "crates/wal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/AdelekCode/nova"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
nova-compression = { path = "crates/compression" }
nova-engine = { path = "crates/engine" }
nova-protocol = { path = "crates/protocol" }
nova-replication = { path = "crates/replication" }
nova-storage = { path = "crates/storage" }
nova-types = { path = "crates/types" }
nova-wal = { path = "crates/wal" }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.45", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
